rules:
  - id: codeguardian-sql-concat
    languages: [python, javascript, java]
    severity: ERROR
    message: SQL query appears to be built from concatenated input.
    metadata:
      category: SQL Injection
      owasp: A03:2021 Injection
      impact: An attacker may alter the query and access or modify unauthorised data.
      remediation: Use parameterised queries and never concatenate request input into SQL.
      corrected_code: cursor.execute("SELECT * FROM users WHERE name = %s", (username,))
    pattern-regex: '(?i)select\s+.*\bwhere\b.*\+\s*\w+'

  - id: codeguardian-hardcoded-secret
    languages: [python, javascript, java]
    severity: ERROR
    message: Possible hardcoded credential or API secret.
    metadata:
      category: Hardcoded Credentials
      owasp: A07:2021 Identification and Authentication Failures
      impact: Exposed credentials can be reused by anyone with repository access.
      remediation: Load secrets from environment variables or a secret manager.
      corrected_code: api_key = os.environ["API_KEY"]
    pattern-regex: '(?i)(password|secret|api_key|apikey|token)\s*[:=]\s*["''][^"'']{4,}["'']'

  - id: codeguardian-weak-hash
    languages: [python, javascript, java]
    severity: WARNING
    message: Weak hash algorithm used.
    metadata:
      category: Insecure Cryptography
      owasp: A02:2021 Cryptographic Failures
      impact: Legacy hash algorithms are vulnerable to collision or brute-force attacks.
      remediation: Use SHA-256 for integrity and Argon2 or bcrypt for passwords.
      corrected_code: hashed = hashlib.sha256(data).hexdigest()
    pattern-regex: '(?i)(md5|sha1)\s*\(|getMessageDigest|createHash\(\s*["''](md5|sha1)'
