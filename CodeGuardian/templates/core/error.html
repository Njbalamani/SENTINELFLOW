{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · CODEGUARDIAN</title>
  <link rel="stylesheet" href="{% static 'css/codeguardian.css' %}">
</head>
<body class="auth-body">
<div class="error-wrap animate-in">
  <div class="error-code">{{ code }}</div>
  <div class="eyebrow">REQUEST STATUS</div>
  <h1>{{ message }}</h1>
  <p>The security workspace is still available. Return to your dashboard or start a new scan.</p>
  <div class="error-actions">
    <a class="btn btn-primary" href="{% url 'core:dashboard' %}">Back to dashboard</a>
    <a class="btn btn-ghost" href="{% url 'scan:upload' %}">New scan</a>
  </div>
</div>
</body>
</html>
