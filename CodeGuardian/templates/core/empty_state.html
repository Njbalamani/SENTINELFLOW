<div class="empty-state">
  <div class="empty-icon">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 6v6c0 4.6 3.2 8.6 8 10 4.8-1.4 8-5.4 8-10V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
  </div>
  <h3>{{ title|default:"Nothing here yet" }}</h3>
  <p>{{ text|default:"Content will appear here once available." }}</p>
  {% if action_url %}<a class="btn btn-primary" href="{{ action_url }}">{{ action_label|default:"Continue" }}</a>{% endif %}
</div>
