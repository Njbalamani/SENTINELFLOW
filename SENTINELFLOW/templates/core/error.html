{% extends "base.html" %}
{% block breadcrumb %}Error {{ code }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="card animate-in" style="max-width:620px;margin:8vh auto;text-align:center;padding:44px 30px">
  <div style="font-size:4rem;font-weight:800;letter-spacing:-.06em;background:linear-gradient(135deg,var(--accent),var(--critical));-webkit-background-clip:text;background-clip:text;color:transparent">{{ code }}</div>
  <h1 style="margin:10px 0">{{ title }}</h1>
  <p class="text-muted">{{ message }}</p>
  <a class="btn btn-primary" href="{% url 'dashboard:home' %}">Return to command center</a>
</div>
{% endblock %}
